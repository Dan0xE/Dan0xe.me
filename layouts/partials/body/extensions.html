{{- if .Store.Get "hasMermaid" -}}
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist/mermaid.esm.min.mjs';

    const diagrams = Array.from(
      document.querySelectorAll('.mermaid-code-block'),
    );
    const definitions = diagrams.map((diagram) => diagram.textContent);

    const renderDiagrams = async () => {
      diagrams.forEach((diagram, index) => {
        diagram.removeAttribute('data-processed');
        diagram.textContent = definitions[index];
      });

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'strict',
        theme: document.body.classList.contains('colorscheme-dark')
          ? 'dark'
          : 'default',
      });
      await mermaid.run({ nodes: diagrams });
    };

    await renderDiagrams();
    document.addEventListener('themeChanged', renderDiagrams);
  </script>
{{- end -}}
